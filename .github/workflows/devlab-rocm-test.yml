# Build and test flash-attention's ROCm backends on consumer AMD GPUs.
#
# setup.py accepts gfx1151 and gfx1201, and prebuilt ROCm wheels ship them,
# but nothing runs the CK backend on any AMD GPU, and the Triton backend only
# runs on MI35X and gfx1100 (in ROCm/aiter's CI). This builds each backend for
# one GPU at a time -- a Radeon 8060S (Strix Halo, gfx1151) and a Radeon AI
# PRO R9700 (gfx1201) -- and runs a deterministic sample of its tests.
#
# The CK leg asserts the CK extension is the one loaded: without it
# flash_attn falls back to Triton and the leg would test the other backend.
#
# Every run uploads summary-*.json (versions, device, pass/fail counts).
#
# Runners: AMD DevLab, a donated pool of ephemeral, single-use machines. One
# job per machine; nothing persists between jobs.
name: ROCm test (gfx1151, gfx1201)

on:
  push:
    branches: [main]
    paths: ["csrc/**", "flash_attn/**", "hopper/**", "setup.py", "tests/test_flash_attn_ck.py",
            "tests/test_flash_attn_triton_amd.py", "third_party/**", ".github/workflows/devlab-rocm-test.yml"]
  workflow_dispatch:
    inputs:
      tests_per_function:
        description: Test cases to run per test function
        default: "20"
  workflow_call:
    inputs:
      image: {type: string, default: rocm/dev-ubuntu-24.04:7.2.4-complete}
      torch_index_url: {type: string, default: https://download.pytorch.org/whl/rocm7.2}
      # pip requirement for torch; "{gfx}" becomes the leg's GPU target
      # (AMD's ROCm 10.x indexes: "torch[device-{gfx}]==<version>").
      torch_spec: {type: string, default: torch}
      tests_per_function: {type: string, default: "20"}
      label: {type: string, default: release}

permissions:
  contents: read

concurrency:
  group: rocm-test-${{ github.ref }}-${{ inputs.label || 'release' }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.backend }} on ${{ matrix.gpu }} (${{ matrix.gfx }})
    strategy:
      fail-fast: false
      matrix:
        backend: [ck, triton]
        gpu: [strix-halo, radeon-r9700]
        include:
          - {gpu: strix-halo, gfx: gfx1151}
          - {gpu: radeon-r9700, gfx: gfx1201}
          - {backend: ck, tests: tests/test_flash_attn_ck.py}
          - {backend: triton, tests: tests/test_flash_attn_triton_amd.py}
    runs-on: [self-hosted, Linux, devlab-dispatch, "${{ matrix.gpu }}"]
    timeout-minutes: 180
    env:
      IMAGE: ${{ inputs.image || 'rocm/dev-ubuntu-24.04:7.2.4-complete' }}
      TORCH_INDEX_URL: ${{ inputs.torch_index_url || 'https://download.pytorch.org/whl/rocm7.2' }}
      TORCH_SPEC: ${{ inputs.torch_spec || 'torch' }}
      PER_FUNCTION: ${{ inputs.tests_per_function || '20' }}
      LABEL: ${{ inputs.label || 'release' }}
      TORCH_INDEX_MAP: ${{ vars.TORCH_INDEX_MAP }}
      SAMPLER_DIR: ${{ github.workspace }}/.devlab
    steps:
      # A runner whose workspace outlived an earlier job (e.g. one cancelled
      # mid-build) can hold root-owned files from that job's container, and
      # checkout cannot delete them.
      - name: Clear root-owned files left in the workspace
        run: |
          ws="$GITHUB_WORKSPACE"
          if [ -n "$(find "$ws" -mindepth 1 ! -user "$(id -u)" -print -quit 2>/dev/null)" ]; then
            echo "workspace has files from an earlier container; resetting ownership"
            docker run --rm -v "$ws:/w" busybox:1.36 chown -R "$(id -u):$(id -g)" /w
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Write the test sampler
        run: |
          # A pytest plugin that keeps a deterministic sample at collection time:
          # every pytest-xdist worker selects the same tests, and node ids never
          # pass through the shell.
          mkdir -p "$SAMPLER_DIR"
          cat > "$SAMPLER_DIR/devlab_sample.py" <<'PY'
          import os
          from collections import defaultdict


          def pytest_collection_modifyitems(config, items):
              per = int(os.environ.get("DEVLAB_PER") or 0)
              if per <= 0:
                  return
              by_file = os.environ.get("DEVLAB_GROUP", "function") == "file"
              groups = defaultdict(list)
              for item in items:
                  nodeid = item.nodeid
                  groups[nodeid.split("::")[0] if by_file else nodeid.split("[")[0]].append(item)
              keep = set()
              for members in groups.values():
                  step = max(1, len(members) // per)
                  keep.update(id(i) for i in members[::step][:per])
              config.hook.pytest_deselected(items=[i for i in items if id(i) not in keep])
              items[:] = [i for i in items if id(i) in keep]
          PY

      - name: Build and test (${{ matrix.backend }}) in ${{ env.IMAGE }}
        id: test
        run: |
          set -euo pipefail
          docker pull -q "$IMAGE"
          INDEX="$TORCH_INDEX_URL"
          # A runner pool with a package mirror maps public indexes to it with the
          # TORCH_INDEX_MAP repository variable (JSON: index URL -> mirror URL).
          # Unset, the index is used as given.
          EXTRA=()
          if [ -n "${TORCH_INDEX_MAP:-}" ]; then
            idx_in="$INDEX"
            # A value is a mirror URL, or a list [index, extra index, ...] when the
            # mirror serves the index's packages from more than one repository.
            idx=$(python3 -c 'import json,sys; m=json.loads(sys.argv[1]); u=sys.argv[2]; v=m.get(u.rstrip("/")+"/", m.get(u.rstrip("/"), u)); print("\n".join([v] if isinstance(v, str) else v))' "$TORCH_INDEX_MAP" "$INDEX")
            mapfile -t idx <<<"$idx"
            INDEX="${idx[0]}"
            for e in "${idx[@]:1}"; do EXTRA+=(--extra-index-url "$e"); done
            [ "$INDEX" = "$idx_in" ] && [ ${#idx[@]} -eq 1 ] || echo "torch index mapped: $idx_in -> $INDEX${EXTRA:+ (extra: ${idx[*]:1})}"
          fi
          export TORCH_INDEX_URL="$INDEX" TORCH_EXTRA_INDEX_ARGS="${EXTRA[*]}"
          # Host networking: the runner resolves its package mirror through
          # /etc/hosts, which a bridged container does not inherit.
          docker run --rm --network host --device=/dev/kfd --device=/dev/dri --group-add video --group-add render \
            --security-opt seccomp=unconfined -v "$PWD:/src" -w /src \
            -e BACKEND=${{ matrix.backend }} -e GFX=${{ matrix.gfx }} -e TESTS=${{ matrix.tests }} \
            -e PER_FUNCTION -e TORCH_INDEX_URL -e TORCH_EXTRA_INDEX_ARGS -e TORCH_SPEC "$IMAGE" bash -euo pipefail -c '
              # Hand /src back to the runner user however this exits.
              trap '"'"'chown -R "$(stat -c %u:%g /src/.git)" /src'"'"' EXIT
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq && apt-get install -y -qq python3-venv python3-dev git ninja-build >/dev/null
              # setup.py runs `git submodule update` in the bind-mounted checkout.
              git config --global --add safe.directory "*"
              python3 -m venv /venv && . /venv/bin/activate
              pip install -q --upgrade pip
              pip install -q "${TORCH_SPEC//\{gfx\}/$GFX}" --index-url "$TORCH_INDEX_URL" $TORCH_EXTRA_INDEX_ARGS
              # Pin torch for every later pip call (a CUDA wheel from PyPI would replace it).
              pip freeze | grep -iE "^(torch|triton|triton-rocm|pytorch-triton-rocm)==" > /tmp/torch-pin.txt
              cat /tmp/torch-pin.txt
              export PIP_CONSTRAINT=/tmp/torch-pin.txt
              # pyyaml: aiter imports it at import time but does not declare it (only in its requirements.txt).
              pip install -q setuptools packaging wheel psutil ninja pyyaml pytest pytest-timeout pytest-xdist einops
              if [ "$BACKEND" = triton ]; then export FLASH_ATTENTION_TRITON_AMD_ENABLE=TRUE; fi
              export GPU_ARCHS="$GFX" FLASH_ATTENTION_FORCE_BUILD=TRUE MAX_JOBS="${MAX_JOBS:-$(nproc)}"
              # The build log is the evidence when it fails: keep it visible.
              # --no-deps: flash-attn requires "triton", but ROCm torch ships its Triton
              # under another distribution name, so pip would install a second Triton
              # from PyPI over the one torch was built with. einops is installed above.
              pip install -v --no-build-isolation --no-deps .
              pip freeze | grep -iE "^(torch|triton|pytorch-triton|amd-aiter|flash)"
              python - <<PY
          import json, torch, triton, flash_attn
          p = torch.cuda.get_device_properties(0)
          ck = True
          try:
              import flash_attn_2_cuda  # noqa: F401
          except ImportError:
              ck = False
          info = {"torch": torch.__version__, "hip": torch.version.hip, "device": p.name,
                  "arch": p.gcnArchName, "triton": triton.__version__, "flash_attn": flash_attn.__version__, "ck_loaded": ck}
          print(info)
          json.dump(info, open("/src/env.json", "w"))
          assert "$GFX" in p.gcnArchName, p.gcnArchName
          if "$BACKEND" == "ck":
              assert ck, "CK extension not loaded: this would test the Triton fallback"
          PY
              rc=0
              PYTHONPATH=/src/.devlab DEVLAB_PER="$PER_FUNCTION" DEVLAB_GROUP=function \
                python -m pytest "$TESTS" -p devlab_sample -q -rfEs -p no:cacheprovider --timeout=600 \
                -n 1 --max-worker-restart=100000 \
                --junitxml=/src/junit.xml || rc=$?
              # Test failures do not fail this step: "Judge results" decides, against
              # the known upstream failures. A broken install or build still fails here.
              echo "$rc" > /src/pytest-rc.txt
            '

      # Red means a new failure or a broken setup. Failures listed in
      # .github/devlab-known-failures.txt (classified upstream) are warnings.
      - name: Judge results
        id: judge
        if: always()
        run: |
          python3 - <<'PY'
          import fnmatch, json, os, sys, xml.etree.ElementTree as ET
          known = []
          kf = ".github/devlab-known-failures.txt"
          if os.path.exists(kf):
              for line in open(kf):
                  line = line.strip()
                  if line and not line.startswith("#"):
                      pat, reason, issue = ([f.strip() for f in line.split("|")] + ["", ""])[:3]
                      known.append((pat, reason, issue or "not filed"))
          def node_id(tc):
              parts = (tc.get("classname") or "").split(".")
              for i in range(len(parts), 0, -1):
                  path = "/".join(parts[:i]) + ".py"
                  if os.path.exists(path):
                      return "::".join([path] + parts[i:] + [tc.get("name", "")])
              return "::".join(parts + [tc.get("name", "")])
          verdict, known_ids, new_ids, why = "fail", [], [], ""
          rc = open("pytest-rc.txt").read().strip() if os.path.exists("pytest-rc.txt") else None
          if "${{ steps.test.outcome }}" != "success":
              why = "install, build or smoke check failed: the tests did not run"
          elif rc not in ("0", "1") or not os.path.exists("junit.xml"):
              why = f"pytest could not run the tests (exit code {rc}, junit {'present' if os.path.exists('junit.xml') else 'missing'})"
          else:
              summ = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
              for tc in ET.parse("junit.xml").getroot().iter("testcase"):
                  if tc.find("failure") is None and tc.find("error") is None:
                      continue
                  nid = node_id(tc)
                  hit = next((k for k in known if fnmatch.fnmatchcase(nid, k[0])), None)
                  if hit:
                      known_ids.append(nid)
                      print(f"::warning title=Known upstream failure::{nid} — {hit[1]} ({hit[2]})")
                      summ.write(f"- known upstream failure: `{nid}` — {hit[1]} ({hit[2]})\n")
                  else:
                      new_ids.append(nid)
                      print(f"::error title=New failure::{nid}")
                      summ.write(f"- NEW failure: `{nid}`\n")
              if new_ids:
                  why = f"{len(new_ids)} failure(s) not in {kf}"
              elif rc == "1" and not known_ids:
                  why = "pytest reported failures but junit lists none"
              else:
                  verdict = "known-failures" if known_ids else "pass"
          json.dump({"verdict": verdict, "known_failures": known_ids, "new_failures": new_ids},
                    open("judge.json", "w"))
          print(f"verdict: {verdict}" + (f" ({why})" if why else ""))
          if verdict == "fail":
              print(f"::error title=Verdict fail::{why}")
              sys.exit(1)
          PY

      - name: Write the run summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, datetime, xml.etree.ElementTree as ET
          def load(p):
              try:
                  return json.load(open(p))
              except Exception:
                  return None
          tests = None
          if os.path.exists("junit.xml"):
              s = ET.parse("junit.xml").getroot()
              s = s if s.tag == "testsuite" else s.find("testsuite")
              n = {k: int(s.get(k, 0)) for k in ("tests", "failures", "errors", "skipped")}
              tests = {"ran": n["tests"], "failed": n["failures"], "errors": n["errors"],
                       "skipped": n["skipped"],
                       "passed": n["tests"] - n["failures"] - n["errors"] - n["skipped"],
                       "seconds": round(float(s.get("time", 0)), 1)}
          judge = load("judge.json") or {"verdict": "fail", "known_failures": [], "new_failures": []}
          summary = {
              "schema": 1, "project": "flash-attention", "label": os.environ["LABEL"],
              "release": "${{ github.sha }}"[:12], "combo": "${{ matrix.backend }}",
              "gpu": "${{ matrix.gpu }}", "gfx": "${{ matrix.gfx }}", "env": load("env.json"),
              "smoke": None, "tests": tests, "job_status": "${{ job.status }}",
              "verdict": judge["verdict"], "known_failures": judge["known_failures"],
              "new_failures": judge["new_failures"],
              "run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "finished": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
          }
          json.dump(summary, open("summary.json", "w"), indent=1)
          print(json.dumps(summary, indent=1))
          PY

      - name: Upload the run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devlab-summary-${{ inputs.label || 'release' }}-${{ matrix.backend }}-${{ matrix.gpu }}-${{ github.run_attempt }}
          path: summary.json
          retention-days: 90
